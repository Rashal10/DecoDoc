name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decodoc
          POSTGRES_PASSWORD: decodoc
          POSTGRES_DB: decodoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decodoc -d decodoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://decodoc:decodoc@localhost:5432/decodoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - run: npm run lint
      - run: npm test
      - run: npm run build
